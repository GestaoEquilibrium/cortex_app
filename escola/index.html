<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório Escolar — Grupo Equilibrium</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/frontend/favicon.svg">
<style>
    body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        background: #ECEEF3; color: #0c1f3f;
    }
    .caixa { text-align: center; padding: 28px; }
    .giro {
        width: 30px; height: 30px; margin: 0 auto 14px;
        border: 3px solid #D6DEEB; border-top-color: #2F6FED;
        border-radius: 50%; animation: g .8s linear infinite;
    }
    @keyframes g { to { transform: rotate(360deg); } }
    p { font-size: 14px; color: #64748B; }
    a { color: #2F6FED; }
</style>
</head>
<body>
<div class="caixa">
    <div class="giro"></div>
    <p>Abrindo…</p>
    <noscript>
        <p>Toque para continuar: <a href="/frontend/escola/index.html">abrir o relatório escolar</a><br>
        (e cole de novo o código que veio no seu link)</p>
    </noscript>
</div>
<script>
// O site é servido a partir da raiz do repositório, então a página de verdade
// mora em /frontend/escola/. Este encaminhador existe para o link curto
// /escola/?t=TOKEN funcionar — é ele que vai no QR e no WhatsApp.
// Precisa ser JS: um meta refresh com URL fixa perderia o ?t=.
(function () {
    var destino = '/frontend/escola/index.html' + (window.location.search || '') + (window.location.hash || '');
    window.location.replace(destino);
})();
</script>
</body>
</html>
